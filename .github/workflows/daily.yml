name: Discord Daily Reminder

on:
  schedule:
    - cron: '40 9 * * *'
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Reminder
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fS -H "Content-Type: application/json" \
            -d '{"content":"🔔 น้องโก้ะดื่มนมด้วยจ้าาา 🥛💕"}' \
            "$WEBHOOK_URL"
